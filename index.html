<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Loja</title>
    <link rel="stylesheet" href="style.css">

<body>

    <h1>Painel Loja</h1>

    <nav>
        <button onclick="mostrarTela('login')">Login</button>
        <button onclick="mostrarTela('produtos')">Produtos</button>
        <button onclick="mostrarTela('admin')">Admin</button>
        <button onclick="mostrarTela('perfil')">Perfil</button>
    </nav>

    <section id="tela-login">
        <h2>Tela de Login</h2>
        <form id="form-login">
            <input type="email" id="email" placeholder="E-mail:">
            <input type="password" id="senha" placeholder="Senha:">
            <button type="submit">Enviar</button>
        </form>
    </section>

    <section id="tela-produtos" style="display: none;">
        <h2>Tela Produtos</h2>
        <p>Aqui entrará a lista vinda da API (aula 4).</p>
    </section>

    <section id="tela-admin" style="display: none;">
        <h2>Área Admin</h2>
        <p>Só quem for admin pode acessar (aula 6).</p>
    </section>

    <section id="tela-perfil" style="display: none;">
        <h2>Perfil </h2>
        <p>Só eu posso acessar meu perfil.</p>
    </section>

    <script>
        function mostrarTela(nome) {

            const telas = document.querySelectorAll('section');

            telas.forEach(tela => {
                tela.style.display = 'none';
            });

            const telaEscolhida = document.getElementById('tela-' + nome);

            telaEscolhida.style.display = 'block';
        }

        const form_login = document.getElementById('form-login');

        form_login.addEventListener('submit', function(evento) {
            evento.preventDefault();

            console.log('formulario enviado, mas a página não recarregou!');

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    senha: senha
                })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                console.log(dados);
            })
            .catch(erro => {
                console.error('Erro ao fazer login:', erro);
            });
        });
    </script>

</body>
</html>
